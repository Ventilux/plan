<!DOCTYPE html>
<html lang="da">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventilux Plan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ventilux Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1018;--flade:#121722;--flade2:#171d2a;--hover:#1c2332;--linje:#232b3a;--linje2:#2e3748;
  --tekst:#e7eaf0;--svag:#8b95a7;--svagere:#5d6779;
  --brand:#4f8cff;--brandsvag:rgba(79,140,255,.12);
  --service:#d9a441;--servicesvag:rgba(217,164,65,.10);
  --gron:#3fb27f;--rod:#e5484d;
  --skygge:0 1px 2px rgba(0,0,0,.25);--skygge2:0 16px 48px rgba(0,0,0,.5);
  --r:10px;color-scheme:dark;
}
:root[data-tema="lys"]{
  --bg:#f5f6f8;--flade:#ffffff;--flade2:#f8f9fb;--hover:#f1f3f6;--linje:#e4e7ec;--linje2:#d0d5dd;
  --tekst:#101828;--svag:#667085;--svagere:#98a2b3;
  --brand:#2563eb;--brandsvag:rgba(37,99,235,.08);
  --service:#b7791f;--servicesvag:rgba(183,121,31,.08);
  --skygge:0 1px 2px rgba(16,24,40,.06);--skygge2:0 16px 40px rgba(16,24,40,.16);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tekst);font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--linje2);border-radius:9px;border:2px solid var(--bg)}

/* ---------- Topbjælke ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--flade);border-bottom:1px solid var(--linje)}
.top-indre{height:56px;padding:0 24px;display:flex;align-items:center;gap:8px}
.maerke{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.maerke b{font-weight:600;font-size:15px;white-space:nowrap}
.maerke small{color:var(--svag);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maerke .skil{color:var(--svagere)}
.rolle{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--linje2);color:var(--svag)}
.tk{height:34px;border:1px solid var(--linje);border-radius:8px;padding:0 12px;font-weight:500;font-size:13px;cursor:pointer;background:var(--flade);color:var(--tekst);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tk:hover{background:var(--hover)}
.tk.ikon{width:34px;padding:0;justify-content:center}
.tk.primaer{background:var(--brand);border-color:var(--brand);color:#fff}
.tk.primaer:hover{filter:brightness(1.08)}
.segment{display:inline-flex;border:1px solid var(--linje);border-radius:8px;padding:2px;background:var(--flade2)}
.segment button{height:28px;border:0;background:transparent;color:var(--svag);padding:0 12px;border-radius:6px;font-weight:500;font-size:13px;cursor:pointer}
.segment button.on{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.datonav{height:56px;padding:0 24px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--linje)}
.datonav .titel{margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.datonav .titel b{font-size:17px;font-weight:600;white-space:nowrap}
.datonav .titel span{font-size:13px;color:var(--svag);white-space:nowrap}

/* ---------- Personvælger ---------- */
.personer{position:sticky;z-index:15;background:var(--bg);border-bottom:1px solid var(--linje)}
.personer-indre{display:flex;gap:6px;overflow-x:auto;padding:10px 24px;scrollbar-width:none}
.personer-indre::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;border:1px solid var(--linje);background:var(--flade);color:var(--svag);border-radius:999px;padding:0 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--tekst)}
.chip.valgt{border-color:var(--brand);color:var(--tekst);background:var(--brandsvag)}
.av{width:26px;height:26px;border-radius:50%;background:var(--flade2);border:1px solid var(--linje2);color:var(--svag);font-size:10.5px;font-weight:600;display:inline-grid;place-items:center;flex:none}

main{padding:20px 24px 110px;max-width:1700px;margin:0 auto}

/* ---------- Nøgletal ---------- */
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--linje);border-radius:var(--r);background:var(--flade);margin-bottom:20px;overflow:hidden}
.kpi-kort{padding:12px 16px;border-left:1px solid var(--linje)}
.kpi-kort:first-child{border-left:0}
.kpi-kort .lbl{font-size:12px;color:var(--svag)}
.kpi-kort .tal{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-kort .tal small{font-size:13px;color:var(--svag);font-weight:500}
.kpi-kort.alarm .tal{color:var(--service)}

/* ---------- Lister og kort ---------- */
.sektion{margin:24px 0 8px;font-size:12px;font-weight:600;color:var(--svag);text-transform:uppercase;letter-spacing:.6px}
.liste{background:var(--flade);border:1px solid var(--linje);border-radius:var(--r);overflow:hidden}
.raekke{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--linje);cursor:pointer}
.raekke:first-child{border-top:0}
.raekke:hover{background:var(--hover)}
.raekke .mk{width:3px;align-self:stretch;border-radius:3px;background:var(--brand);flex:none}
.raekke.service .mk{background:var(--service)}
.raekke.fri .mk{background:var(--linje2)}
.raekke .krop{flex:1;min-width:0}
.raekke .titel{font-weight:500;word-break:break-word}
.raekke.fri .titel{color:var(--svag)}
.raekke .meta{color:var(--svag);font-size:12.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.raekke .meta span{display:inline-flex;align-items:center;gap:5px}
.raekke .pil-h{color:var(--svagere);align-self:center}
.notetag{color:var(--tekst)}
.prik{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.prik.booket{background:var(--gron)}.prik.afventer{background:var(--service)}.prik.udfort{background:var(--svagere)}
.tom{text-align:center;color:var(--svag);padding:48px 16px;background:var(--flade);border:1px dashed var(--linje2);border-radius:var(--r)}
.tom b{display:block;color:var(--tekst);font-weight:600;margin-bottom:4px}

/* ---------- Teamoversigt (dag) ---------- */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pkort{background:var(--flade);border:1px solid var(--linje);border-radius:var(--r);overflow:hidden}
.pkort .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--linje)}
.pkort .ph b{flex:1;font-weight:600;font-size:13.5px}
.pkort .ph .antal{color:var(--svag);font-size:12px}
.pkort .raekke{padding:10px 12px}
.fri-tekst{color:var(--svagere);padding:12px;font-size:13px}

/* ---------- Uge-tavle (PC) ---------- */
.tavle-wrap{background:var(--flade);border:1px solid var(--linje);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 250px)}
table.tavle{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;table-layout:fixed}
.tavle th,.tavle td{border-bottom:1px solid var(--linje);border-right:1px solid var(--linje);vertical-align:top;padding:0}
.tavle tr>*:last-child{border-right:0}
.tavle tbody tr:last-child td{border-bottom:0}
.tavle thead th{position:sticky;top:0;z-index:3;background:var(--flade);padding:10px 12px;text-align:left;font-weight:500}
.tavle thead th .dn{font-size:12px;color:var(--svag)}
.tavle thead th .dd{font-size:15px;font-weight:600;margin-top:1px}
.tavle thead th.idag{box-shadow:inset 0 -2px 0 var(--brand)}
.tavle thead th.idag .dn,.tavle thead th.idag .dd{color:var(--brand)}
.tavle th.navn,.tavle td.navn{position:sticky;left:0;z-index:2;background:var(--flade);width:200px;padding:10px 14px}
.tavle thead th.navn{z-index:4;vertical-align:bottom;color:var(--svag);font-size:12px}
.tavle td.navn .rk{display:flex;align-items:center;gap:10px;font-weight:500}
.tavle td.celle{padding:6px;height:1px}
.tavle td.celle.idag{background:var(--brandsvag)}
.tavle td.celle.weekend{background:var(--flade2)}
.celle-indre{display:flex;flex-direction:column;gap:4px;min-height:40px;height:100%}
.blok{border-radius:6px;padding:6px 8px 6px 9px;font-size:12.5px;line-height:1.35;cursor:pointer;background:var(--flade2);border:1px solid var(--linje);box-shadow:inset 2px 0 0 var(--brand);word-break:break-word}
.blok:hover{border-color:var(--linje2);background:var(--hover)}
.blok .bn{font-size:11.5px;margin-top:2px;color:var(--svag);display:flex;align-items:center;gap:4px}
.blok .bn svg.i{width:12px;height:12px;vertical-align:-1px}
.blok.service{box-shadow:inset 2px 0 0 var(--service);background:var(--servicesvag)}
.blok.ferie{box-shadow:none;background:transparent;border-style:dashed;color:var(--svag)}
.tilfoej{flex:1;min-height:28px;border:1px dashed transparent;border-radius:6px;background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center}
td.celle:hover .tilfoej{border-color:var(--linje2);color:var(--svag)}
.ufordelt td.navn .rk{color:var(--service)}

/* ---------- Mobil-uge ---------- */
.mdag{margin-bottom:16px}
.mdag h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--svag);display:flex;gap:8px;align-items:center}
.mdag h3 .idag-tag{color:var(--brand);text-transform:none}

/* ---------- Bundbjælke (mobil) ---------- */
.bund{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--flade);border-top:1px solid var(--linje);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bund button{flex:1;border:0;border-radius:8px;padding:6px 4px;font-weight:500;font-size:11px;background:transparent;color:var(--svag);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.bund button svg.i{width:20px;height:20px}
.bund button.on{color:var(--brand)}

/* ---------- Ark (detaljer / formular) ---------- */
.slor{position:fixed;inset:0;background:rgba(5,8,14,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:ind .12s}
.ark{background:var(--flade);border:1px solid var(--linje);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:var(--skygge2);padding:6px 20px calc(20px + env(safe-area-inset-bottom));animation:op .18s ease-out}
.ark .greb{width:36px;height:4px;border-radius:9px;background:var(--linje2);margin:6px auto 14px}
.ark .over{color:var(--svag);font-size:12.5px;display:flex;align-items:center;gap:8px}
.ark h2{margin:8px 0 2px;font-size:19px;font-weight:600;line-height:1.3;word-break:break-word}
.ark .under{color:var(--svag);font-size:13.5px}
.ark .boks{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--flade2);border:1px solid var(--linje);white-space:pre-wrap;word-break:break-word}
.ark .boks.note{border-left:3px solid var(--brand)}
.ark .boks h4{margin:0 0 4px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--svag)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--svag);margin-top:10px}
.knapper{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.k{flex:1;min-width:130px;height:42px;border:1px solid var(--linje2);background:var(--flade);border-radius:8px;padding:0 14px;font-weight:500;font-size:14px;cursor:pointer;color:var(--tekst);display:inline-flex;justify-content:center;align-items:center;gap:8px}
.k:hover{background:var(--hover)}
.k.primaer{background:var(--brand);border-color:var(--brand);color:#fff}
.k.primaer:hover{filter:brightness(1.08)}
.k.fare{color:var(--rod);border-color:rgba(229,72,77,.4)}
.felt{margin-top:14px}
.felt label{display:block;font-size:12.5px;font-weight:500;color:var(--svag);margin-bottom:6px}
.felt input,.felt textarea{width:100%;border:1px solid var(--linje2);border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--tekst);font-size:15px}
.felt textarea{min-height:90px;resize:vertical}
.felt input:focus,.felt textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.raekke2{display:flex;gap:10px}.raekke2 .felt{flex:1}
.vaelg{display:flex;flex-wrap:wrap;gap:6px}
.lille{font-size:12.5px;color:var(--svag)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--tekst);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:var(--skygge2);animation:op .18s}
@keyframes op{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:none}
@keyframes ind{from{opacity:0}to{opacity:1}}
.indl main{opacity:.55;transition:opacity .2s}
.spinner{width:28px;height:28px;border:2px solid var(--linje2);border-top-color:var(--brand);border-radius:50%;animation:dr .8s linear infinite;margin:90px auto}
@keyframes dr{to{transform:rotate(360deg)}}

/* ---------- PIN ---------- */
.pin{min-height:100vh;display:grid;place-items:center;padding:20px}
.pinboks{background:var(--flade);border:1px solid var(--linje);border-radius:14px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:var(--skygge2)}
.pinboks .logo{width:44px;height:44px;border-radius:11px;font-size:21px;margin:0 auto 14px}
.pinboks h1{margin:0;font-size:20px;font-weight:600}
.pinboks input{width:100%;font-size:26px;text-align:center;letter-spacing:12px;padding:11px;border-radius:8px;border:1px solid var(--linje2);background:var(--bg);color:var(--tekst);margin:20px 0 8px}
.pinboks input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.pinboks .fejl{color:var(--rod);min-height:20px;font-size:13px}

/* ---------- PC / mobil ---------- */
@media (min-width:900px){
  .ark{border-radius:14px;margin-bottom:8vh;align-self:center}
  .slor{align-items:center}
  .bund{display:none}
  main{padding-bottom:40px}
}
@media (max-width:899px){
  .kun-pc{display:none!important}
  .top-indre{padding:0 12px;gap:6px}
  .maerke .skil,.maerke .rolle{display:none}
  .datonav{padding:0 12px;height:52px}
  .datonav .titel{flex-direction:column;gap:0}
  .datonav .titel b{font-size:16px}
  .datonav .titel span{font-size:12px}
  .personer-indre{padding:8px 12px}
  main{padding:14px 12px 100px}
  .kpi{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}
  .kpi-kort{padding:10px 12px}.kpi-kort .tal{font-size:19px}
  .kpi-kort:nth-child(n+4){display:none}
}
@media print{.top,.personer,.bund,.kpi{display:none}.tavle-wrap{max-height:none;overflow:visible}}
</style>
</head>

<script>
/* Forbindelse til Ventilux-serveren (Google). Ingen data eller koder ligger i denne fil. */
var API = 'https://script.google.com/macros/s/AKfycbxxlIps5EA_Od25hsEyS2sXHtv3zTx5gf3v9un_1KlgwN2DEoyxJ5Pd25WazITWVtL8WQ/exec';
(function () {
  if (window.google && window.google.script) return; // (testvisning)
  function kald(fn, args, ok, fejl) {
    fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args})})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (r) { if (r && r.__fejl) throw new Error(r.__fejl); if (ok) ok(r); })
      .catch(function (e) { if (fejl) fejl(e); });
  }
  Object.defineProperty(window, 'google', {value: {script: {}}});
  Object.defineProperty(window.google.script, 'run', {get: function () {
    var ok, fejl, o = {
      withSuccessHandler: function (f) { ok = f; return o; },
      withFailureHandler: function (f) { fejl = f; return o; }
    };
    ['planHent', 'planGem'].forEach(function (fn) { o[fn] = function () { kald(fn, [].slice.call(arguments), ok, fejl); }; });
    return o;
  }});
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

<script>
var S = {pin: '', rolle: '', person: '', visning: '', dato: idagTekst(), data: null, personer: [], weekend: false, tema: ''};
var PC = window.matchMedia('(min-width:900px)').matches;
function gem(k, v) { try { localStorage.setItem('vxplan_' + k, v); } catch (e) {} }
function hent(k) { try { return localStorage.getItem('vxplan_' + k) || ''; } catch (e) { return ''; } }
function idagTekst() { return tilTekst(new Date()); }
function tilDato(t) { var s = t.split('-'); return new Date(+s[0], +s[1] - 1, +s[2]); }
function tilTekst(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function plusDage(t, n) { var d = tilDato(t); d.setDate(d.getDate() + n); return tilTekst(d); }
function mandag(t) { var d = tilDato(t); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return tilTekst(d); }
function erWeekend(t) { var g = tilDato(t).getDay(); return g === 0 || g === 6; }
var DAGE = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
var MDR = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
function langDato(t) { var d = tilDato(t); return DAGE[d.getDay()] + ' ' + d.getDate() + '. ' + MDR[d.getMonth()]; }
function kortDato(t) { var d = tilDato(t); return d.getDate() + '/' + (d.getMonth() + 1); }
function stort(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function uge(t) { var d = tilDato(t); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); var w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function init(n) { var p = String(n).split(/\s+/); return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : (p[0].charAt(1) || ''))).toUpperCase(); }
function av(n) { return '<span class="av">' + esc(init(n)) + '</span>'; }
function maps(t) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t + ', Danmark'); }
function erFri(t) { return /^(ferie|fri|syg|kursus|afspadsering)\b/i.test(String(t).trim()); }
function tlfListe(t) { var ud = [], re = /(\+45[\s-]?)?(\d{2}[\s-]?\d{2}[\s-]?\d{2}[\s-]?\d{2})(?!\d)/g, m; t = String(t || ''); while ((m = re.exec(t))) { var n = m[2].replace(/\D/g, ''); if (ud.indexOf(n) < 0) ud.push(n); } return ud; }
function linkify(t) {
  return esc(t)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/([\w.+-]+@[\w-]+\.[\w.-]+)/g, '<a href="mailto:$1">$1</a>')
    .replace(/((?:\+45[\s-]?)?\d{2}[\s-]?\d{2}[\s-]?\d{2}[\s-]?\d{2})(?!\d)/g, function (x) { return '<a href="tel:' + x.replace(/[^\d+]/g, '') + '">' + x + '</a>'; });
}
function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
function jsq(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function ik(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + IK[n] + '</svg>'; }
function statusKlasse(s) { return s === 'Booket' ? 'booket' : s === 'Udført' ? 'udfort' : 'afventer'; }

/* ---------- Start og PIN ---------- */
function start() {
  S.pin = hent('pin'); S.person = hent('person'); S.weekend = hent('weekend') === '1'; saetTema(hent('tema') || 'moerk');
  S.visning = hent('visning') || (PC ? 'uge' : 'dag');
  if (!S.pin) return visPin('');
  indlaes();
}
function visPin(fejl) {
  document.getElementById('app').innerHTML =
    '<div class="pin"><div class="pinboks"><div class="logo">V</div><h1>Ventilux Plan</h1>' +
    '<div class="lille" style="margin-top:4px">Skriv din PIN-kode</div>' +
    '<input id="pinfelt" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">' +
    '<div class="fejl">' + esc(fejl) + '</div><button class="k primaer" style="width:100%" onclick="tjekPin()">Log ind</button></div></div>';
  var f = document.getElementById('pinfelt'); f.focus();
  f.addEventListener('keydown', function (e) { if (e.key === 'Enter') tjekPin(); });
}
function tjekPin() { S.pin = document.getElementById('pinfelt').value.trim(); indlaes(true); }
function logUd() { gem('pin', ''); S.pin = ''; lukArk(); visPin(''); }

/* ---------- Data ---------- */
function interval() { return S.visning === 'uge' ? {fra: mandag(S.dato), dage: 7} : {fra: S.dato, dage: 1}; }
function indlaes(fraPin, stille) {
  var iv = interval();
  if (!stille) document.body.classList.add('indl');
  google.script.run.withSuccessHandler(function (res) {
    document.body.classList.remove('indl');
    if (res && res.fejl === 'pin') { gem('pin', ''); return visPin(fraPin ? 'Forkert PIN-kode – prøv igen' : ''); }
    gem('pin', S.pin);
    S.data = res; S.personer = res.personer; S.rolle = res.rolle;
    if (res.mig) S.person = res.mig;
    else if (S.person && S.personer.indexOf(S.person) < 0) S.person = '';
    tegn();
  }).withFailureHandler(function () {
    document.body.classList.remove('indl');
    if (!S.data) document.getElementById('app').innerHTML = '<div class="tom" style="margin:40px 16px"><b>Kunne ikke hente planen</b>Tjek internetforbindelsen.<br><br><button class="k primaer" onclick="indlaes()">Prøv igen</button></div>';
    else toast('Kunne ikke opdatere – tjek forbindelsen');
  }).planHent(S.pin, iv.fra, iv.dage);
}
function skift(n) { S.dato = plusDage(S.dato, S.visning === 'uge' ? 7 * n : n); indlaes(); }
function iDag() { S.dato = idagTekst(); indlaes(); }
function vaelgPerson(p) { S.person = p; gem('person', p); tegn(); }
function vaelgVisning(v) { S.visning = v; gem('visning', v); indlaes(); }
function slaaWeekend() { S.weekend = !S.weekend; gem('weekend', S.weekend ? '1' : ''); tegn(); }
function dagMed(dato) { for (var i = 0; i < S.data.dage.length; i++) if (S.data.dage[i].dato === dato) return S.data.dage[i]; return null; }

var REF = [];
function ref(o) { REF.push(o); return REF.length - 1; }

/* ---------- Rækker ---------- */
function opgRaekke(o, dato, visNavn) {
  var fri = erFri(o.tekst), meta = [];
  if (visNavn) meta.push('<span>' + ik('person') + esc(o.navn) + '</span>');
  if (o.note) meta.push('<span class="notetag">' + ik('note') + 'Note</span>');
  return '<div class="raekke' + (fri ? ' fri' : '') + '" onclick="visDetalje(' + ref({t: 'opg', o: o, dato: dato}) + ')"><span class="mk"></span>' +
    '<div class="krop"><div class="titel">' + esc(o.tekst || 'Se note') + '</div>' + (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') + '</div>' +
    '<span class="pil-h">' + ik('hoejre') + '</span></div>';
}
function srvRaekke(s, dato, visFolk) {
  return '<div class="raekke service" onclick="visDetalje(' + ref({t: 'srv', s: s, dato: dato}) + ')"><span class="mk"></span>' +
    '<div class="krop"><div class="titel">' + esc(s.kunde) + '</div><div class="meta">' +
    '<span>' + ik('vaerktoej') + 'Service · ' + esc(s.opgave) + '</span>' +
    '<span><i class="prik ' + statusKlasse(s.status) + '"></i>' + esc(s.status) + '</span>' +
    (visFolk ? '<span>' + ik('hold') + esc(s.ansvarlige.join(', ') || 'Ikke fordelt') + '</span>' : '') +
    '</div></div><span class="pil-h">' + ik('hoejre') + '</span></div>';
}
function mine(dag, p) {
  return {op: dag.opgaver.filter(function (o) { return !p || o.navn === p; }), sv: dag.service.filter(function (s) { return !p || s.ansvarlige.indexOf(p) >= 0; })};
}

/* ---------- Visninger ---------- */
function visDag() {
  var dag = S.data.dage[0], h = '';
  if (S.person) {
    var m = mine(dag, S.person);
    if (!m.op.length && !m.sv.length) h += '<div class="tom"><b>Ingen opgaver denne dag</b>Brug pilene for at se andre dage.</div>';
    else {
      h += '<div class="liste">';
      m.op.forEach(function (o) { h += opgRaekke(o, dag.dato, false); });
      m.sv.forEach(function (s) { h += srvRaekke(s, dag.dato, true); });
      h += '</div>';
    }
    if (S.rolle === 'admin') h += '<button class="k" style="width:100%;margin-top:12px" onclick="nyOpgave(\'' + dag.dato + '\',[\'' + jsq(S.person) + '\'])">' + ik('plus') + 'Tilføj opgave</button>';
    return h;
  }
  h += '<div class="team">';
  S.personer.forEach(function (p) {
    var m = mine(dag, p), n = m.op.length + m.sv.length;
    h += '<div class="pkort"><div class="ph">' + av(p) + '<b>' + esc(p) + '</b>' + (n ? '<span class="antal">' + n + '</span>' : '') +
      (S.rolle === 'admin' ? '<button class="tk ikon" title="Tilføj opgave" onclick="nyOpgave(\'' + dag.dato + '\',[\'' + jsq(p) + '\'])">' + ik('plus') + '</button>' : '') + '</div>';
    if (!n) h += '<div class="fri-tekst">Intet planlagt</div>';
    m.op.forEach(function (o) { h += opgRaekke(o, dag.dato, false); });
    m.sv.forEach(function (s) { h += srvRaekke(s, dag.dato, false); });
    h += '</div>';
  });
  h += '</div>';
  var uf = dag.service.filter(function (s) { return !s.ansvarlige.length; });
  if (uf.length) { h += '<div class="sektion">Service – ikke fordelt (' + uf.length + ')</div><div class="liste">'; uf.forEach(function (s) { h += srvRaekke(s, dag.dato, false); }); h += '</div>'; }
  return h;
}

function visUgeMobil() {
  var h = '', idag = idagTekst();
  S.data.dage.forEach(function (dag) {
    var m = mine(dag, S.person);
    if (erWeekend(dag.dato) && !m.op.length && !m.sv.length && !S.weekend) return;
    h += '<div class="mdag"><h3><span>' + esc(stort(langDato(dag.dato))) + '</span>' + (dag.dato === idag ? '<span class="idag-tag">· i dag</span>' : '') + '</h3><div class="liste">';
    if (!m.op.length && !m.sv.length) h += '<div class="fri-tekst">Intet planlagt</div>';
    m.op.forEach(function (o) { h += opgRaekke(o, dag.dato, !S.person); });
    m.sv.forEach(function (s) { h += srvRaekke(s, dag.dato, !S.person); });
    h += '</div></div>';
  });
  return h || '<div class="tom"><b>Intet planlagt</b>Der er ingen opgaver i denne uge.</div>';
}

function visTavle() {
  var idag = idagTekst();
  var dage = S.data.dage.filter(function (d) { return !erWeekend(d.dato) || S.weekend || d.opgaver.length || d.service.length; });
  var pers = S.person ? [S.person] : S.personer;
  var h = '<div class="tavle-wrap"><table class="tavle"><thead><tr><th class="navn">Medarbejder</th>';
  dage.forEach(function (d) { var dt = tilDato(d.dato); h += '<th class="' + (d.dato === idag ? 'idag' : '') + '"><div class="dn">' + esc(stort(DAGE[dt.getDay()])) + (d.dato === idag ? ' · i dag' : '') + '</div><div class="dd">' + dt.getDate() + '. ' + MDR[dt.getMonth()].slice(0, 3) + '</div></th>'; });
  h += '</tr></thead><tbody>';
  pers.forEach(function (p) {
    h += '<tr><td class="navn"><div class="rk">' + av(p) + '<span>' + esc(p) + '</span></div></td>';
    dage.forEach(function (d) {
      var m = mine(d, p);
      h += '<td class="celle' + (d.dato === idag ? ' idag' : '') + (erWeekend(d.dato) ? ' weekend' : '') + '"><div class="celle-indre">';
      m.op.forEach(function (o) {
        var fri = erFri(o.tekst);
        h += '<div class="blok' + (fri ? ' ferie' : '') + '" onclick="visDetalje(' + ref({t: 'opg', o: o, dato: d.dato}) + ')">' + esc(o.tekst || 'Se note') + (o.note ? '<div class="bn">' + ik('note') + 'Note</div>' : '') + '</div>';
      });
      m.sv.forEach(function (s) { h += '<div class="blok service" onclick="visDetalje(' + ref({t: 'srv', s: s, dato: d.dato}) + ')">' + esc(s.kunde) + '<div class="bn"><i class="prik ' + statusKlasse(s.status) + '"></i>Service</div></div>'; });
      if (S.rolle === 'admin' && !m.op.length) h += '<button class="tilfoej" title="Tilføj opgave" onclick="nyOpgave(\'' + d.dato + '\',[\'' + jsq(p) + '\'])">' + ik('plus') + '</button>';
      h += '</div></td>';
    });
    h += '</tr>';
  });
  if (!S.person && dage.some(function (d) { return d.service.some(function (s) { return !s.ansvarlige.length; }); })) {
    h += '<tr class="ufordelt"><td class="navn"><div class="rk">' + ik('vaerktoej') + '<span>Service – ikke fordelt</span></div></td>';
    dage.forEach(function (d) {
      h += '<td class="celle' + (d.dato === idag ? ' idag' : '') + '"><div class="celle-indre">';
      d.service.filter(function (s) { return !s.ansvarlige.length; }).forEach(function (s) { h += '<div class="blok service" onclick="visDetalje(' + ref({t: 'srv', s: s, dato: d.dato}) + ')">' + esc(s.kunde) + '<div class="bn">' + esc(s.opgave) + '</div></div>'; });
      h += '</div></td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function kpiHtml() {
  var idag = idagTekst(), fokus = dagMed(idag) || S.data.dage[0];
  var navn = fokus.dato === idag ? 'i dag' : kortDato(fokus.dato);
  var p = S.person;
  var op = fokus.opgaver.filter(function (o) { return !p || o.navn === p; });
  var fri = op.filter(function (o) { return erFri(o.tekst); });
  var arb = {}; op.forEach(function (o) { if (!erFri(o.tekst)) arb[o.navn] = 1; });
  var sv = fokus.service.filter(function (s) { return !p || s.ansvarlige.indexOf(p) >= 0; });
  var uf = 0; S.data.dage.forEach(function (d) { uf += d.service.filter(function (s) { return !s.ansvarlige.length; }).length; });
  function k(lbl, tal, cls) { return '<div class="kpi-kort ' + (cls || '') + '"><div class="lbl">' + lbl + '</div><div class="tal">' + tal + '</div></div>'; }
  return '<div class="kpi">' +
    k('Opgaver ' + navn, op.length - fri.length) +
    (p ? k('Fri / ferie ' + navn, fri.length) : k('På arbejde ' + navn, Object.keys(arb).length + ' <small>af ' + S.personer.length + '</small>')) +
    k('Service ' + navn, sv.length) +
    k('Service ikke fordelt' + (S.visning === 'uge' ? ' (uge)' : ''), uf, uf ? 'alarm' : '') +
    '</div>';
}

function tegn() {
  REF = [];
  var uge7 = S.visning === 'uge', titel, under;
  if (uge7) { var f = S.data.dage[0].dato, t = S.data.dage[6].dato; titel = 'Uge ' + uge(f); under = kortDato(f) + ' – ' + kortDato(t) + ' ' + tilDato(t).getFullYear(); }
  else { titel = stort(langDato(S.dato)); under = (S.dato === idagTekst() ? 'I dag · ' : '') + 'uge ' + uge(S.dato); }
  var chips = '<button class="chip' + (S.person ? '' : ' valgt') + '" onclick="vaelgPerson(\'\')">' + ik('hold') + 'Alle</button>';
  S.personer.forEach(function (p) { chips += '<button class="chip' + (S.person === p ? ' valgt' : '') + '" onclick="vaelgPerson(\'' + jsq(p) + '\')">' + esc(p) + '</button>'; });
  var indhold = uge7 ? (PC ? visTavle() : visUgeMobil()) : visDag();
  var erIdag = S.dato === idagTekst() || (uge7 && mandag(S.dato) === mandag(idagTekst()));
  document.getElementById('app').innerHTML =
    '<div class="top"><div class="top-indre">' +
      '<div class="maerke"><span class="logo">V</span><b>Ventilux Plan</b><span class="skil">/</span><small>' + esc(S.person || 'Hele holdet') + '</small>' + (S.rolle === 'admin' ? '<span class="rolle kun-pc">Ledelse</span>' : '') + '</div>' +
      (S.rolle === 'admin' ? '<button class="tk primaer" onclick="nyOpgave(\'' + S.dato + '\',' + (S.person ? '[\'' + jsq(S.person) + '\']' : '[]') + ')">' + ik('plus') + '<span class="kun-pc">Ny opgave</span></button>' : '') +
      (S.person ? '<button class="tk" onclick="visKalender()" title="Min kalender">' + ik('kal') + '<span class="kun-pc">Min kalender</span></button>' : '') +
      '<button class="tk ikon" onclick="skiftTema()" title="Skift lyst/mørkt tema">' + ik(S.tema === 'lys' ? 'maane' : 'sol') + '</button>' +
      '<button class="tk ikon" onclick="visMenu()" title="Mere">' + ik('mere') + '</button>' +
    '</div><div class="datonav">' +
      '<div class="titel"><b>' + esc(titel) + '</b><span>' + esc(under) + '</span></div>' +
      '<div class="segment kun-pc"><button class="' + (uge7 ? '' : 'on') + '" onclick="vaelgVisning(\'dag\')">Dag</button><button class="' + (uge7 ? 'on' : '') + '" onclick="vaelgVisning(\'uge\')">Uge</button></div>' +
      (uge7 ? '<button class="tk kun-pc" onclick="slaaWeekend()">' + (S.weekend ? 'Skjul weekend' : 'Vis weekend') + '</button>' : '') +
      '<button class="tk kun-pc ikon" onclick="indlaes()" title="Opdatér">' + ik('opdater') + '</button>' +
      (erIdag ? '' : '<button class="tk" onclick="iDag()">I dag</button>') +
      '<button class="tk ikon" onclick="skift(-1)" aria-label="Forrige">' + ik('venstre') + '</button>' +
      '<button class="tk ikon" onclick="skift(1)" aria-label="Næste">' + ik('hoejre') + '</button></div></div>' +
    (S.data.mig ? '' : '<div class="personer"><div class="personer-indre">' + chips + '</div></div>') +
    '<main>' + kpiHtml() + indhold + '<div class="lille" style="text-align:center;margin-top:18px">Opdateret kl. ' + esc(S.data.opdateret) + '</div></main>' +
    '<nav class="bund"><button class="' + (uge7 ? '' : 'on') + '" onclick="vaelgVisning(\'dag\')">' + ik('kal') + 'Dag</button>' +
      '<button class="' + (uge7 ? 'on' : '') + '" onclick="vaelgVisning(\'uge\')">' + ik('uge') + 'Uge</button>' +
      '<button onclick="iDag()">' + ik('i_dag') + 'I dag</button>' +
      '<button onclick="indlaes()">' + ik('opdater') + 'Opdatér</button></nav>';
  var top = document.querySelector('.top'), pb = document.querySelector('.personer'); if (pb) pb.style.top = top.offsetHeight + 'px';
  var v = document.querySelector('.chip.valgt'); if (v && v.scrollIntoView) v.scrollIntoView({inline: 'center', block: 'nearest'});
}

/* ---------- Tema ---------- */
function saetTema(t) { S.tema = t; document.documentElement.setAttribute('data-tema', t === 'lys' ? 'lys' : 'moerk'); var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'lys' ? '#ffffff' : '#0c1018'; }
function skiftTema() { saetTema(S.tema === 'lys' ? 'moerk' : 'lys'); gem('tema', S.tema); if (S.data) tegn(); }

/* ---------- Ark: detaljer ---------- */
function aabnArk(html) {
  document.getElementById('lag').innerHTML = '<div class="slor" onclick="if(event.target===this)lukArk()"><div class="ark"><div class="greb"></div>' + html + '</div></div>';
}
function lukArk() { document.getElementById('lag').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lukArk(); });
function ringKnap(n) { return '<a class="k" href="tel:' + n + '">' + ik('tlf') + 'Ring ' + n.replace(/(\d{2})(?=\d)/g, '$1 ') + '</a>'; }

function visDetalje(i) {
  var r = REF[i], h = '';
  if (r.t === 'opg') {
    var o = r.o, fri = erFri(o.tekst), tl = tlfListe(o.tekst + ' ' + o.note);
    h += '<div class="over">' + av(o.navn) + esc(o.navn) + ' · ' + esc(stort(langDato(r.dato))) + '</div>';
    h += '<h2>' + esc(o.tekst || 'Opgave') + '</h2>';
    if (o.note) h += '<div class="boks note"><h4>Note</h4>' + linkify(o.note) + '</div>';
    else if (!fri) h += '<div class="lille" style="margin-top:8px">Ingen note til denne opgave.</div>';
    var andre = o.med || (dagMed(r.dato) || {opgaver: []}).opgaver.filter(function (x) { return x.navn !== o.navn && x.tekst && x.tekst === o.tekst; }).map(function (x) { return x.navn; });
    if (andre.length) h += '<div class="boks"><h4>Også på opgaven</h4>' + esc(andre.join(', ')) + '</div>';
    h += '<div class="knapper">' + (fri || !o.tekst ? '' : '<a class="k primaer" href="' + maps(o.tekst) + '" target="_blank">' + ik('rute') + 'Vis rute</a>');
    tl.forEach(function (n) { h += ringKnap(n); });
    if (S.rolle === 'admin') h += '<button class="k" onclick="retOpgave(' + i + ')">' + ik('ret') + 'Ret</button>';
    h += '<button class="k" onclick="lukArk()">Luk</button></div>';
  } else {
    var s = r.s, t2 = tlfListe(s.kontakt);
    h += '<div class="over">' + ik('vaerktoej') + 'Service-besøg · ' + esc(stort(langDato(r.dato))) + (s.dag ? ' · dag ' + s.dag : '') + '</div>';
    h += '<h2>' + esc(s.kunde) + '</h2><div class="under">' + esc(s.opgave) + ' · ca. ' + String(s.timer).replace('.', ',') + ' timer' + (s.mand > 1 ? ' · ' + s.mand + ' mand' : '') + '</div>';
    h += '<div class="status"><i class="prik ' + statusKlasse(s.status) + '"></i>' + esc(s.status) + '</div>';
    h += '<div class="boks"><h4>På opgaven</h4>' + esc(s.ansvarlige.join(', ') || 'Ikke fordelt endnu') + '</div>';
    if (s.kontakt) h += '<div class="boks note"><h4>Kontakt hos kunden</h4>' + linkify(s.kontakt) + '</div>';
    h += '<div class="knapper"><a class="k primaer" href="' + maps(s.kunde) + '" target="_blank">' + ik('rute') + 'Vis rute</a>';
    t2.forEach(function (n) { h += ringKnap(n); });
    h += '<button class="k" onclick="lukArk()">Luk</button></div>';
    if (S.rolle === 'admin') h += '<div class="lille" style="margin-top:12px">Service-besøg rettes i den interne fil (Service oversigt).</div>';
  }
  aabnArk(h);
}

/* ---------- Ark: ny / ret opgave (ledelse) ---------- */
var FORM = null;
function nyOpgave(dato, navne) { FORM = {ny: true, dato: dato, til: dato, navne: navne.slice(), tekst: '', note: ''}; visForm(); }
function retOpgave(i) { var r = REF[i]; FORM = {ny: false, dato: r.dato, til: r.dato, navne: [r.o.navn], tekst: r.o.tekst, note: r.o.note}; visForm(); }
function visForm() {
  var f = FORM, ch = '';
  S.personer.forEach(function (p) { ch += '<button type="button" class="chip' + (f.navne.indexOf(p) >= 0 ? ' valgt' : '') + '" onclick="formPerson(\'' + jsq(p) + '\')">' + esc(p) + '</button>'; });
  aabnArk('<h2>' + (f.ny ? 'Ny opgave' : 'Ret opgave') + '</h2><div class="under">Gemmes direkte i renseplanen.</div>' +
    '<div class="felt"><label>Opgave / adresse</label><input id="f_tekst" value="' + esc(f.tekst) + '" placeholder="Fx Brandholms Allé 1A"></div>' +
    '<div class="felt"><label>Note til medarbejderen (valgfri)</label><textarea id="f_note" placeholder="Fx: Ring til viceværten på 22 33 44 55 ved ankomst. Nøgle i boks 4.">' + esc(f.note) + '</textarea></div>' +
    '<div class="raekke2"><div class="felt"><label>Dato</label><input type="date" id="f_dato" value="' + f.dato + '"></div>' +
    '<div class="felt"><label>Til og med</label><input type="date" id="f_til" value="' + f.til + '"></div></div>' +
    '<div class="lille" style="margin-top:8px"><label><input type="checkbox" id="f_weekend"> Medtag lørdag og søndag</label></div>' +
    '<div class="felt"><label>Medarbejdere</label><div class="vaelg">' + ch + '</div></div>' +
    '<div class="knapper"><button class="k primaer" id="f_gem" onclick="formGem()">Gem</button>' +
    (f.ny ? '' : '<button class="k fare" onclick="formSlet(this)">' + ik('slet') + 'Fjern</button>') +
    '<button class="k" onclick="lukArk()">Annullér</button></div>' +
    '<div class="lille" style="margin-top:10px">Står der allerede noget på dagen, bliver det erstattet. Alt gemmes også i opgave-arkivet.</div>');
  setTimeout(function () { var x = document.getElementById('f_tekst'); if (x) x.focus(); }, 50);
}
function formLaes() { FORM.tekst = document.getElementById('f_tekst').value; FORM.note = document.getElementById('f_note').value; FORM.dato = document.getElementById('f_dato').value; FORM.til = document.getElementById('f_til').value || FORM.dato; FORM.weekend = document.getElementById('f_weekend').checked; }
function formPerson(p) { formLaes(); var i = FORM.navne.indexOf(p); if (i >= 0) FORM.navne.splice(i, 1); else FORM.navne.push(p); visForm(); }
function formGem(slet) {
  formLaes();
  if (!FORM.navne.length) return toast('Vælg mindst én medarbejder');
  if (!slet && !FORM.tekst.trim() && !FORM.note.trim()) return toast('Skriv en opgave');
  if (FORM.til < FORM.dato) FORM.til = FORM.dato;
  var b = document.getElementById('f_gem'); if (b) { b.disabled = true; b.textContent = 'Gemmer…'; }
  var data = {dato: FORM.dato, til: FORM.til, navne: FORM.navne, tekst: slet ? '' : FORM.tekst, note: slet ? '' : FORM.note, weekend: FORM.weekend};
  google.script.run.withSuccessHandler(function (r) {
    if (r && r.fejl) { toast(r.fejl); if (b) { b.disabled = false; b.textContent = 'Gem'; } return; }
    lukArk(); toast(slet ? 'Opgaven er fjernet' : 'Gemt (' + r.antal + (r.antal === 1 ? ' dag' : ' felter') + ')' + (r.mangler && r.mangler.length ? ' – nogle datoer findes ikke i renseplanen' : ''));
    indlaes(false, true);
  }).withFailureHandler(function (e) { toast('Kunne ikke gemme: ' + (e && e.message || 'fejl')); if (b) { b.disabled = false; b.textContent = 'Gem'; } }).planGem(S.pin, data);
}
function formSlet(b) { if (b.getAttribute('data-ok')) return formGem(true); b.setAttribute('data-ok', '1'); b.innerHTML = 'Klik igen for at fjerne'; }

/* ---------- Kalender-abonnement ---------- */
function visKalender() {
  var noegle = S.data.noegler[S.person], https = S.data.webapp + '?ical=' + noegle, webcal = https.replace(/^https:/, 'webcal:');
  aabnArk('<h2>' + esc(S.person) + ' – kalender på telefonen</h2><div class="under">Dine opgaver og service-besøg vises automatisk i telefonens kalender og opdateres løbende.</div>' +
    '<div class="knapper"><a class="k primaer" href="' + webcal + '">iPhone</a>' +
    '<a class="k primaer" href="https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal) + '" target="_blank">Android / Google</a>' +
    '<a class="k" href="https://outlook.live.com/calendar/0/addfromweb?url=' + encodeURIComponent(https) + '&name=' + encodeURIComponent('Ventilux – ' + S.person) + '" target="_blank">Outlook</a></div>' +
    '<div class="felt"><label>Eller kopiér linket</label><input readonly value="' + esc(https) + '" onclick="this.select()" style="font-size:12.5px"></div>' +
    '<div class="lille" style="margin-top:10px">Linket er personligt – del det ikke med andre.</div>' +
    '<div class="knapper"><button class="k" onclick="lukArk()">Luk</button></div>');
}

function visMenu() {
  aabnArk('<h2>Ventilux Plan</h2><div class="under">' + (S.rolle === 'admin' ? 'Logget ind som ledelse' : S.data.mig ? 'Logget ind som ' + S.data.mig : 'Logget ind som medarbejder') + '</div>' +
    '<div class="knapper" style="flex-direction:column">' +
    (S.rolle === 'admin' ? '<a class="k" href="' + S.data.renseplan + (S.data.dage[0].kolonne ? '&range=' + S.data.dage[0].kolonne + '1' : '') + '" target="_blank">' + ik('ark') + 'Åbn renseplanen (regneark)</a>' : '') +
    '<button class="k" onclick="window.print()">' + ik('print') + 'Udskriv denne visning</button>' +
    '<button class="k" onclick="logUd()">' + ik('ud') + 'Log ud</button><button class="k" onclick="lukArk()">Luk</button></div>');
}

/* ---------- Swipe + automatisk opdatering ---------- */
var tx = null, ty = null;
document.addEventListener('touchstart', function (e) { if (document.getElementById('lag').innerHTML) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
document.addEventListener('touchend', function (e) {
  if (tx === null || !S.data) return;
  var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && !e.target.closest('.personer,.tavle-wrap')) skift(dx < 0 ? 1 : -1);
  tx = null;
}, {passive: true});
var sidsteDag = idagTekst();
setInterval(function () {
  if (!S.data || document.visibilityState !== 'visible' || document.getElementById('lag').innerHTML) return;
  if (idagTekst() !== sidsteDag) { sidsteDag = idagTekst(); S.dato = sidsteDag; }
  indlaes(false, true);
}, 120000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.data) indlaes(false, true); });
window.matchMedia('(min-width:900px)').addEventListener('change', function (m) { PC = m.matches; if (S.data) tegn(); });
start();
</script>
